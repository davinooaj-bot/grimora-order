
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grimora Store</title>
<style>
body{margin:0;background:#0b0b12;color:#eee;font-family:Arial,sans-serif}
header{text-align:center;padding:28px 15px;background:#151522;border-bottom:1px solid #34344b}
h1{letter-spacing:4px;margin:0;color:#a99bff}
main{max-width:500px;margin:24px auto;padding:16px}
.card{background:#171722;padding:20px;border-radius:14px;border:1px solid #303044}
label{display:block;margin:14px 0 7px}
input,select{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;border:1px solid #45455a;background:#0d0d16;color:white}
button{width:100%;padding:13px;margin-top:20px;background:#a99bff;color:#111;font-weight:bold;border:0;border-radius:8px}
.note{font-size:12px;color:#aaa;line-height:1.6}
</style>
</head>
<body>
<header>
<h1>GRIMORA</h1>
<p>ORDER PANEL</p>
</header>

<main>
<div class="card">
<h2>Pesan Layanan</h2>

<label>Pilih layanan</label>
<select id="service">
<option value="">Memuat layanan...</option>
</select>
<p id="serviceInfo" class="note">Menghubungkan ke supplier...</p>

<label>Link / Target</label>
<input id="target" placeholder="Masukkan link target">

<label>Jumlah</label>
<input id="qty" type="number" min="1" placeholder="Masukkan jumlah">

<p class="note">Periksa link dan jumlah sebelum melanjutkan.</p>
<button onclick="order()">Buat Pesanan</button>
<p id="result" class="note"></p>
</div>
</main>

<script>
// GANTI dengan alamat Worker kamu, tanpa /api/services di belakang
const API_URL = "TEMPEL_ALAMAT_WORKER_KAMU";

async function loadServices(){
  const select = document.getElementById("service");
  const info = document.getElementById("serviceInfo");

  try {
    const response = await fetch(API_URL + "/api/services");
    const result = await response.json();

    if (!response.ok || result.error) {
      throw new Error(result.error || "Gagal memuat layanan");
    }

    const services = Array.isArray(result)
  ? result
  : result.services || result.data || [];

    if (!services.length) {
      throw new Error("Daftar layanan tidak ditemukan");
    }

    select.innerHTML =
      '<option value="">-- Pilih layanan --</option>';

    services.forEach(item => {
      const id = item.service ?? item.id;
      const name = item.name ?? item.service_name ?? "Layanan";
      if (id === undefined || id === null) return;

      const option = document.createElement("option");
      option.value = id;
      option.textContent = name;
      select.appendChild(option);
    });

    if (select.options.length <= 1) {
      throw new Error("Format data layanan tidak sesuai");
    }

    info.textContent = "Layanan supplier berhasil dimuat.";
  } catch (error) {
    select.innerHTML =
      '<option value="">Layanan gagal dimuat</option>';
    info.textContent =
      error.message + ". Periksa alamat Worker dan format respons API.";
  }
}

function order(){
  const service = document.getElementById("service").value;
  const target = document.getElementById("target").value.trim();
  const qty = Number(document.getElementById("qty").value);
  const result = document.getElementById("result");

  if(!service || !target || !Number.isInteger(qty) || qty < 1){
    result.textContent = "Lengkapi layanan, target, dan jumlah.";
    return;
  }

  result.textContent =
    "Demo: layanan berhasil dipilih, tetapi pesanan belum dikirim. Sistem harga dan pembayaran perlu disiapkan terlebih dahulu.";
}

loadServices();
</script>
</body>
</html>
